name: QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  # 3.7 can't come from setup-python on ubuntu-latest (dropped on Ubuntu 24.04), so it runs in a
  # container. Installs the built wheel, not `-e .`: hatchling needs >=3.8, so an editable/sdist
  # install would fail on 3.7 for reasons unrelated to our code. The lab machine installs a wheel
  # from PyPI - this tests that path.
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  test-py37:
    needs: build-wheel
    runs-on: ubuntu-latest
    container: python:3.7-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - run: pip install dist/*.whl pytest
      - run: pytest
