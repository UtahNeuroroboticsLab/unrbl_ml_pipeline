# Model catalog for unrbl_ml_pipeline.
# This file is documentation -- the Python registry in __init__.py is the source of truth.
# Add an entry here when you add a model file.

[examplemodel]
description = "Simple dense network for testing and as a model-file template"
status = "implemented"

[caleb_decoder]
description = "LSTM decoder from Vu et al. EMBC 2021 (PMC12742979)"
paper = "https://pmc.ncbi.nlm.nih.gov/articles/PMC12742979/"
model_type = "keras"
status = "implemented"

[clstm_decoder]
description = "Causal Conv1D-LSTM decoder for iEMG prosthesis control"
paper = "Ferrisi (in preparation)"
model_type = "keras"
status = "implemented"

[clstm_kalman]
description = "CLSTM decoder with Kalman filter post-processing"
paper = "Ferrisi (in preparation)"
model_type = "keras"
status = "implemented"

[kf_decoder]
description = "Linear-Gaussian Kalman filter decoder (OLS fit, steady-state gain)"
model_type = "estimator"
status = "implemented"

[resnet50_decoder]
description = "ResNet50 decoder for iEMG prosthesis control"
model_type = "keras"
status = "implemented"

[alexnet]
description = "AlexNet-style CNN adapted for Prosthesis control from iEMG data"
paper = "Krizhevsky et al., 2012"
status = "planned"

[mamba_decoder]
description = "Mamba-1 mamba regression decoder, carry/reset"
model_type = "keras"
status = "implemented"

[tcn_mamba_decoder]
description = "Mamba-1 tcn_mamba regression decoder, carry/reset"
model_type = "keras"
status = "implemented"

[mamba_tcn_decoder]
description = "Mamba-1 mamba_tcn regression decoder, carry/reset"
model_type = "keras"
status = "implemented"

[mamba_tcl_decoder]
description = "Mamba-1 mamba_tcl regression decoder, carry/reset"
model_type = "keras"
status = "implemented"

[mamba_lstm_decoder]
description = "Mamba-1 mamba_lstm regression decoder, carry/reset"
model_type = "keras"
status = "implemented"

[george2018]
description = "CNN from George et al. EMBC 2018"
paper = "https://ieeexplore.ieee.org/document/8513342"
status = "planned"
